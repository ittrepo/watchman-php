name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint
        run: find src bin config tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: PHP 7.4 syntax guard
        run: php tools/php74-guard.php
      - name: Tests
        run: vendor/bin/phpunit
